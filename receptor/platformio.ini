[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM7
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    witnessmenow/UniversalTelegramBot @ ^1.3.0
; UniversalTelegramBot usa funciones de ArduinoJson 7 ya marcadas como obsoletas
; (siguen funcionando); se silencian para que no llenen el panel de Problems
build_flags = -Wno-deprecated-declarations

; Mismo firmware sin Telegram ni nube: sirve para comprobar si la pérdida de paquetes
; viene del Wi-Fi/TLS (si sigue igual, el problema está en la radio o la alimentación)
[env:diagnostico]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSIN_NUBE
